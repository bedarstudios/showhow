name: Board Sync

# The projection itself lives in bedar-workflows so every repo's board derives
# its columns from one file. This half is what only Showhow can know: when to
# run, and which project to write to.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  # Hourly reconcile. The board LOOKS draggable, and dragging a card is the
  # obvious thing to try -- but it writes nothing back to the labels, so the
  # card silently disagrees with reality until the next label event on that
  # issue happens to recompute it. This snaps every card back within the hour,
  # so a drag fails visibly and soon rather than quietly and much later.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to resync (blank = all open issues)"
        required: false

# Rapid label changes on one issue must not race each other. Serialise per
# issue; cancel-in-progress is deliberately false so the LAST event still runs.
concurrency:
  group: board-sync-${{ github.event.issue.number || github.event.inputs.issue || 'bulk' }}
  cancel-in-progress: false

jobs:
  sync:
    uses: bedarstudios/bedar-workflows/.github/workflows/board-sync.yml@v1
    with:
      project_number: 2
      issue: ${{ fromJSON(github.event.inputs.issue || 0) }}
    secrets:
      BEDAR_LOOP_PAT: ${{ secrets.BEDAR_LOOP_PAT }}
