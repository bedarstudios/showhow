name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run branding:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test
      - id: browser-install
        run: npm run test:browser:install
      # Temporary PR72 controls; remove after remote RED/GREEN evidence.
      - name: Observe PR72 export controls
        id: mp4-controls
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 72 && github.head_ref == 'ticket/67-optimize-mp4-size'
        timeout-minutes: 16
        run: |
          git fetch --no-tags --depth=1 origin 7b8885497986829d4498e70c7c1c8ec876f77222
          mp4_controls_exit_code=0
          for phase in oracle red-paired red-quality green-paired green-quality; do
            python3 artifacts/67/ci-controls.py "$phase" || mp4_controls_exit_code=1
          done
          exit "$mp4_controls_exit_code"
      - name: Preserve PR72 control evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 72 && github.head_ref == 'ticket/67-optimize-mp4-size'
        uses: actions/upload-artifact@v4
        with:
          name: mp4-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/67/ci-validation/
          retention-days: 7
          if-no-files-found: warn
      # Preserve the normal suite even when an observation step failed.
      - if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: npm run test:browser

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx vite build

  semantic-pr:
    name: Validate PR title (semantic)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            perf
            docs
            test
            build
            ci
            style
            revert
          requireScope: false
