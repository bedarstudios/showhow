name: Copilot environment setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Verify toolchain
        run: |
          test "$(node --version)" = v22.22.1
          test "$(npm --version)" = 10.9.4
      - run: npm ci
      - run: npm run test:browser:install
      - name: Record successful setup
        run: touch /tmp/showhow-copilot-setup-ok
