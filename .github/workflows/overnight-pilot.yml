name: Copilot cloud controller

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, start, reconcile]
        default: dry-run
      issue:
        description: Approved issue number for dry-run or start
        type: string
        required: false
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '0 3 * * *'
      timezone: Europe/London

concurrency:
  group: copilot-cloud-ownership
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  controller:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Run trusted controller without candidate code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_DISPATCH_TOKEN: ${{ secrets.BEDAR_LOOP_PAT }}
          CLOUD_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' && 'nightly' || 'reconcile') || inputs.mode }}
          CLOUD_ISSUE: ${{ inputs.issue }}
        run: node .github/scripts/overnight-cli.mjs
