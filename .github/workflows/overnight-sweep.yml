name: Overnight Cold Review Sweep

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional single open PR to sweep instead of every open PR
        required: false
        type: number

permissions:
  pull-requests: read
  issues: write

jobs:
  # Showhow is the only repo a poller currently targets, so it is the only one
  # that calls this. The threshold and the one-comment-per-outage rule live in
  # the shared workflow now, not here.
  check-poller-liveness:
    uses: bedarstudios/bedar-workflows/.github/workflows/poller-heartbeat.yml@v1
    secrets:
      BEDAR_LOOP_PAT: ${{ secrets.BEDAR_LOOP_PAT }}

  dispatch-cold-reviewers:
    uses: bedarstudios/bedar-workflows/.github/workflows/overnight-sweep.yml@v1
    with:
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || 0) }}
    secrets:
      BEDAR_LOOP_PAT: ${{ secrets.BEDAR_LOOP_PAT }}
