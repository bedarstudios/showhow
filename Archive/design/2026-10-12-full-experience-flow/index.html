selector.onchange=()=>go(selector.value);document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'Light':'Dark';};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.row!==undefined){clear();selected=+b.dataset.row;state=recordings[selected].guide<0?'F4':recordings[selected].brief?'B':'A';output=recordings[selected].brief?'brief':'guide';render();return}if(b.dataset.output){output=b.dataset.output;render();return}const a=b.dataset.action;if(!a)return;if(['record','import','make','editor','export'].includes(a))beginFlow(a);trigger=['record','import','make','export','menu','hud-menu'].includes(a)?a:trigger;if(a.startsWith('setting:')){setting=a.slice(8);state={'AI connections':'J-ai',Recording:'J-recording',Transcription:'J-transcription',Agents:'J-agents',Appearance:'J-appearance'}[setting]}else if(a.startsWith('appearance:')){document.body.classList.toggle('dark',a==='appearance:Dark'||a==='appearance:System'&&matchMedia('(prefers-color-scheme:dark)').matches);document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'Light':'Dark'}else if(a.startsWith('jump:')){position=a.slice(5)}else if(a==='record'){modal='setup';state='G1'}else if(a==='import'){modal='import';state='H1'}else if(a==='make'){genKind=output;modal='review';state='F1'}else if(a==='generate'){modal='';state='F2';timer=setTimeout(finishGeneration,2500)}else if(a==='cancel-generation'){clearTimeout(timer);state='C'}else if(a==='provider'){modal='';state='J-ai';setting='AI connections'}else if(a==='start'){startRecording()}else if(a==='pause'){paused=!paused}else if(a==='stop'){clearInterval(interval);state='G-saving';timer=setTimeout(()=>{addRecording();state='G3';render()},1200)}else if(a==='restart'){startRecording();menu=''}else if(a==='cancel-recording'){clearInterval(interval);state='A';menu=''}else if(a==='hud-menu'){menu=menu?'':'hud'}else if(a==='choose'){modal='import-progress';state='H2';timer=setTimeout(finishImport,2000)}else if(a==='editor'){state=recordings[selected].imported?'I-noclicks':'I';applied=false}else if(a==='apply'){applied=true}else if(a==='undo'){applied=false}else if(a==='redo'){applied=true}else if(a==='discard'){b.closest('.proposal').innerHTML='<span class="mono">Proposal discarded</span>';return}else if(a==='export'){modal='export';state='I-export'}else if(a==='run-export'){modal='export-progress';state='I-export-progress';timer=setTimeout(finishExport,2500)}else if(a==='cancel-export'){clearTimeout(timer);modal='export-cancelled';state='I-export-cancelled'}else if(a==='settings'){state='J-ai';setting='AI connections'}else if(a==='library'){modal='';state='A'}else if(a==='menu'){menu=menu?'':'recording'}else if(a==='empty'){empty=true;menu='';state='D'}else if(a==='loading'){loading=true;menu='';state='E'}else if(a==='restore'){empty=loading=false;state='A'}else if(a==='rename'){recordings[selected].new=true;menu=''}else if(a==='delete'){recordings.splice(selected,1);selected=0;empty=!recordings.length;menu=''}else if(a==='dismiss-notice'){importNotice=false}else if(a==='key'){keyInput=true}else if(a==='save-key'){state='J-rejected';keyInput=false}else if(a==='sign'){signedOut=!signedOut;state='J-ai'}else if(a==='close'){close();return}else if(a==='copy'||a==='copy-path'){try{await navigator.clipboard.writeText(a==='copy'?briefText+'\n'+bundle:bundle)}catch{let input=document.createElement('textarea');input.value=a==='copy'?briefText+'\n'+bundle:bundle;document.body.append(input);input.select();document.execCommand('copy');input.remove()}toast(a==='copy'?'Brief and bundle path copied':'Bundle path copied');return}else if(a==='play'||a==='preview'){playing=!playing}else if(a==='edit-step'){const title=b.closest('.step').querySelector('.step-title');title.innerHTML=`<input aria-label="Step title" value="${esc(title.textContent)}">`;return}else if(a==='depth'||a==='format'||a.startsWith('tab:')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');return}else if(a==='noop'){return}else{toast(a==='finder'?'Opened in Finder (mock)':a==='pdf'?'Guide PDF exported (mock)': 'Updated (mock)');return}render()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('.row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}if(e.target.id==='rename')recordings[selected].title=e.target.value;if(e.target.classList.contains('scrub')){position=`${Math.floor(e.target.value/60)}:${String(e.target.value%60).padStart(2,'0')}`;document.querySelector('#position').textContent=position+' / '+recordings[selected].duration}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(modal||menu))close();if(e.key==='Tab'&&modal){let list=[...document.querySelectorAll('.sheet button,.sheet input,.sheet select,.sheet textarea')];let first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('sheet'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
render();
</script></body></html>
