<style>

@media (hover:hover) and (pointer:fine){

}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function develop(card){
  const dev=$('canvas.dev',card);if(!dev){card.removeAttribute('data-dev');return}
  const wrap=dev.parentElement,w=wrap.clientWidth||760,h=wrap.clientHeight||475,cols=Math.ceil(w/4),rows=Math.ceil(h/4);
  dev.width=cols;dev.height=rows;const ctx=dev.getContext('2d'),img=ctx.createImageData(cols,rows);
  const dark=document.body.classList.contains('dark');
  const pal=(dark?['#1F2421','#2E4A40','#82B09A']:['#F7F2E8','#E7F1EC','#82B09A','#33564A']).map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
  const L=pal.length-1,cols3=pal,cell=new Uint8Array(cols*rows),r=rng(7);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const f=.5+.5*Math.sin(x*.045+1)*Math.cos(y*.055);const v=(dark?.18:.12)+.5*f*f+.06*r();const bb=(BAYER[(y&3)*4+(x&3)]+.5)/16;cell[y*cols+x]=Math.max(0,Math.min(L,Math.floor(v*L+bb)))}
  const paint=t=>{const d=img.data;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x,b=(BAYER[(y&3)*4+(x&3)]+.5)/16,o=i*4;if(b<t){d[o+3]=0}else{const c=cols3[cell[i]];d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}}ctx.putImageData(img,0,0)};
  const fin=()=>{dev.remove();card.removeAttribute('data-dev')};
  if(RM()){paint(0);dev.style.transition='opacity 200ms';requestAnimationFrame(()=>{dev.style.opacity=0;setTimeout(fin,220)});return}
  const dur=600*T,t0=performance.now();paint(0);dev.dataset.p='0';
  const rid=run&&run.id;
  const step=now=>{if(!dev.isConnected)return;if(rid&&(!run||run.id!==rid)){return}const p=Math.min(1,(now-t0)/dur),e=1-(1-p)*(1-p);dev.dataset.p=e.toFixed(3);if(p>=1){fin();return}paint(e);requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

const tip={timer:0,close:0,open:false,cur:null},tipEl=$('#tip');
function showTip(t,instant){if(!t.isConnected)return;const w=win.getBoundingClientRect(),r=t.getBoundingClientRect();tipEl.textContent=t.dataset.tip;tipEl.classList.toggle('instant',instant);
 const tw=tipEl.offsetWidth,th=tipEl.offsetHeight;let top=r.top-w.top-th-8,orig='bottom center';if(top<34){top=r.bottom-w.top+8;orig='top center'}let left=r.left-w.left+r.width/2-tw/2;left=Math.max(8,Math.min(w.width-tw-8,left));tipEl.style.cssText=`left:${left}px;top:${top}px;transform-origin:${orig}`;tipEl.classList.add('show');tip.open=true;tip.cur=t}

document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const t=e.target.closest?.('[data-tip]');if(!t||t===tip.cur&&tip.open)return;clearTimeout(tip.close);clearTimeout(tip.timer);if(tip.open)showTip(t,true);else tip.timer=setTimeout(()=>showTip(t,false),400*T)});

 at(600,()=>{if(kind==='guide'){r.guide=4}else{r.brief=true}stopGen();state='F3';render();scrollToOutput(false)})}
function failRun(){const r=sel();r.guide=-1;const dev=$$('.step',$('#gnew')||document).length;
 const sl=$('#sl');sl.innerHTML=`<span class="row">${ic('x')}<span>ChatGPT stopped responding. Your recording and the ${dev||2} developed steps are safe.</span></span>`;sl.classList.add('fail2');
 $$('.tk').forEach(li=>{if($('.spin',li))$('.tki',li).innerHTML='<i class="pend"></i>'});
 $('#genbtns').innerHTML=`<span style="display:flex;gap:8px">${B('Try again','retry','primary','refresh')}${B('Change provider','provider','secondary')}</span>`;
 const st=$('#st-guide');if(st){st.className='st bad';st.textContent='FAILED'}
 const rid=run.id;run.timers.forEach(clearTimeout);state='F4';run=null;$$('.dev').forEach(d=>d.remove())}

/* ---------- navigation ---------- */
function clear(){clearTimeout(timer);clearInterval(interval);stopGen();holdCancel();modal='';menu='';empty=false;loading=false}
function resetState(){clear();recordings=base.map(r=>({...r}));selected=0;output='guide';applied=false;paused=false;seconds=0;setting='AI connections';keyInput=false;keyDone=false;connected=false;signedOut=false;importNotice=true;genKind='guide';playing=false;posSec=0;trigger=null}
function addRecording(imported=false){recordings.unshift({title:imported?'client-setup':'Untitled recording',duration:imported?'4:31':`0:${pad2(Math.max(seconds,4))}`,sec:imported?271:Math.max(seconds,4),date:'TODAY',time:'NOW',clicks:3,guide:0,brief:false,edit:!imported,imported,word:imported?'IMPORTED':'',fresh:true,salt:6});selected=0;output='guide';importNotice=true}
function go(s){resetState();state=s;pin=['pdf','R','R2'].includes(s)?s:null;selected=recordings.findIndex(r=>r.title==='Invoice total rounds wrong');
 if(s==='B'){selected=1;output='brief'}
 if(['C','F1','F2','F3'].includes(s))selected=4;
 if(s==='C')recordings[4].guide=0;if(s==='F3')recordings[4].guide=4;if(s==='F4')selected=3;
 empty=s==='D';loading=s==='E';
 if(s==='F1'){modal='review';prevState='C'}
 if(s==='G1'){modal='setup';prevState='A'}if(s==='G2')startRecording();if(s==='G3'){state='G3';addRecording()}
 if(s==='H1'){modal='import';prevState='A'}if(s==='H2'){modal='import-progress';prevState='A';timer=setTimeout(finishImport,2000*T)}if(s==='H3')addRecording(true);
 if(s==='I-noclicks')selected=2;
 if(s.startsWith('I-export')){prevState='I';modal=s==='I-export'?'export':s.replace('I-','');if(s==='I-export-progress')timer=setTimeout(finishExport,2500*T)}
 if(s.startsWith('J'))setting=({'J-recording':'Recording','J-transcription':'Transcription','J-agents':'Agents','J-appearance':'Appearance'})[s]||'AI connections';
 if(s==='pdf'){modal='pdf';prevState='A';state='A'}if(s==='R'){modal='remake-confirm';prevState='A';state='A'}
 selector.value=s;
 if(s==='F2'){genKind='guide';startGen();selector.value=s;return}
 if(s==='F4'){genKind='guide';startGen({fail:true});selector.value=s;return}
 if(s==='R2'){state='A';genKind='guide';startGen({remake:true});selector.value=s;return}
 render();selector.value=s}
function startRecording(){clearInterval(interval);seconds=0;paused=false;state='G2';modal='';interval=setInterval(()=>{if(!paused){seconds++;const t=$('#timer');if(t)t.textContent=clock()}},1000)}
function finishImport(){modal='';addRecording(true);state='H3';render()}
function finishExport(){modal='export-done';state='I-export-done';render()}
function close(){clearTimeout(timer);const wasMenu=menu&&!modal;modal='';menu='';if(state.startsWith('I-export'))state='I';else if(['F1','G1','H1','H2'].includes(state))state=prevState||'A';render();if(trigger){const b=$$('button').find(b=>b.dataset.action===trigger);b?.focus()}}
selector.onchange=()=>go(selector.value);
$('#sample').onclick=()=>go('A');
$('#theme').onclick=()=>{document.body.classList.toggle('dark');$('#theme').textContent=document.body.classList.contains('dark')?'Light':'Dark';if(state==='J-appearance')render()};
$('#d-serif').onclick=()=>setDisplay(false);$('#d-sans').onclick=()=>setDisplay(true);
function setDisplay(s){document.body.classList.toggle('sans',s);$('#d-serif').classList.toggle('on',!s);$('#d-sans').classList.toggle('on',s);placeUl(false)}
$('#m-1').onclick=()=>setMotion(1);$('#m-10').onclick=()=>setMotion(10);
function setMotion(n){T=n;document.documentElement.style.setProperty('--t',n);$('#m-1').classList.toggle('on',n===1);$('#m-10').classList.toggle('on',n===10)}

document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(b&&!b.closest('.toolbar'))pin=null;
 if(menu&&!e.target.closest('#menu')&&!(b&&b.dataset.action==='menu')){menu='';$('#menuHost').innerHTML=''}
 if(!b)return;
 if(b.matches('[data-hold]')||b.closest('.toolbar'))return;
 if(b.dataset.row!==undefined){clear();selected=+b.dataset.row;const r=sel();state=r.guide<0?'F4':r.brief?'B':'A';output=r.brief?'brief':'guide';posSec=0;render();return}
 if(b.dataset.output){setOutput(b.dataset.output);return}
 if(b.dataset.seek!==undefined){setPos(+b.dataset.seek);return}
 const a=b.dataset.action;if(!a)return;
 if(['record','import','make','pdf','remake','export','menu','hud-menu'].includes(a))trigger=a;
 if(a.startsWith('setting:')){setting=a.slice(8);state={'AI connections':'J-ai',Recording:'J-recording',Transcription:'J-transcription',Agents:'J-agents',Appearance:'J-appearance'}[setting]}
 else if(a.startsWith('appearance:')){document.body.classList.toggle('dark',a==='appearance:Dark'||a==='appearance:System'&&matchMedia('(prefers-color-scheme:dark)').matches);$('#theme').textContent=document.body.classList.contains('dark')?'Light':'Dark'}
 else if(a.startsWith('disp:')){pickedDisp=+a.slice(5);$$('.disp').forEach((d,i)=>d.setAttribute('aria-checked',i===pickedDisp));return}
 else if(a==='record'){prevState=state;modal='setup';state='G1'}
 else if(a==='import'){prevState=state;modal='import';state='H1'}
 else if(a==='make'){prevState=state;genKind=output;modal='review';state='F1'}
 else if(a==='generate'){modal='';startGen();return}
 else if(a==='retry'){genKind='guide';startGen();return}
 else if(a==='remake'){prevState=state;modal='remake-confirm'}
 else if(a==='do-remake'){modal='';genKind='guide';startGen({remake:true});return}
 else if(a==='cancel-generation'){const r=sel(),rm=run&&run.remake,pg=run&&run.prevGuide;stopGen();if(rm){state='A'}else{r.guide=0;state='C'}toast('Stopped. Nothing was changed.')}
 else if(a==='provider'){stopGen();modal='';state='J-ai';setting='AI connections'}
 else if(a==='start'){startRecording()}
 else if(a==='pause'){paused=!paused;b.querySelector('.slot').classList.toggle('on',paused);b.setAttribute('aria-label',paused?'Resume':'Pause');b.dataset.tip=paused?'Resume':'Pause';return}
 else if(a==='stop'){clearInterval(interval);state='G-saving';hudSaving();return}
 else if(a==='restart'){startRecording();menu=''}
 else if(a==='cancel-recording'){clearInterval(interval);state='A';menu=''}
 else if(a==='hud-menu'){menu=menu?'':'hud'}
 else if(a==='choose'){modal='import-progress';state='H2';timer=setTimeout(finishImport,2000*T)}
 else if(a==='editor'){prevState=state;state=sel().imported?'I-noclicks':'I';applied=false}
 else if(a==='apply'){loadBtn(b,'Applying…',600,()=>{applied=true;render()});return}
 else if(a==='undo'){applied=false}else if(a==='redo'){applied=true}
 else if(a==='discard'){b.closest('.proposal').innerHTML='<span class="mono">Proposal discarded</span>';return}
 else if(a==='export'){modal='export';state='I-export'}
 else if(a==='run-export'){modal='export-progress';state='I-export-progress';timer=setTimeout(finishExport,2500*T)}
 else if(a==='cancel-export'){clearTimeout(timer);modal='export-cancelled';state='I-export-cancelled'}
 else if(a==='run-pdf'){modal='pdf-progress';render();pdfRun();return}
 else if(a==='cancel-pdf'){clearTimeout(timer);clearTimeout(run2);close();return}
 else if(a==='settings'){state='J-ai';setting='AI connections'}
 else if(a==='library'){modal='';state=sel().guide<0?'F4':sel().brief&&prevState==='B'?'B':'A';if(['I','I-noclicks'].includes(state))state='A'}
 else if(a==='menu'){menu=menu?'':'recording'}
 else if(a==='empty'){empty=true;menu='';state='D'}
 else if(a==='loading'){loading=true;menu='';state='E'}
 else if(a==='restore'){empty=loading=false;state='A'}
 else if(a==='rename'){sel().edit=true;menu=''}
 else if(a==='dismiss-notice'){importNotice=false}
 else if(a==='key'){keyInput=true}
 else if(a==='save-key'){loadBtn(b,'Saving…',900,()=>{keyInput=false;keyDone=true;if(state==='J-rejected')state='J-ai';render()});return}
 else if(a==='sign'){if(state==='J-expired'||signedOut){loadBtn(b,'Connecting…',900,()=>{signedOut=false;connected=true;if(state==='J-expired')state='J-ai';render()})}else{signedOut=true;connected=false;render()}return}
 else if(a==='close'){close();return}
 else if(a==='copy'||a==='copy-path'){doCopy(b,a==='copy'?briefText+'\n'+bundle:bundle);return}
 else if(a==='play'||a==='preview'){playing=!playing;b.querySelector('.slot')?.classList.toggle('on',playing);b.setAttribute('aria-label',playing?'Pause':'Play');b.dataset.tip=playing?'Pause':'Play';return}
 else if(a==='edit-step'){const title=b.closest('.step').querySelector('.stitle');if(title.querySelector('input'))return;const v=title.textContent;title.innerHTML=`<input aria-label="Step title" value="${esc(v)}">`;title.querySelector('input').focus();return}
 else if(a==='depth'||a==='format'||a.startsWith('tab:')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');return}
 else if(a==='noop'){return}
 else{toast(a==='finder'?'Opened in Finder (mock)':'Updated (mock)');return}
 render()});
/* HUD saving transition */
function hudSaving(){const h=$('#hud');if(!h)return;h.innerHTML='<span class="rec-dot"></span><span class="sv fadein"><i class="spin"></i>Saving…</span>';
 timer=setTimeout(()=>{addRecording();state='G3';render()},1200*T)}
/* pdf */
let run2;
function pdfRun(){const st=$('#pbar');const t0=performance.now();run2=setTimeout(()=>{if(!$('#pbar'))return;$('#pbar').innerHTML=progressBar();mountCanvases($('#pbar'));const c=$('#pbar canvas'),stt=c._st,d=1500*T;const step=n=>{const p=Math.min(1,(n-t1)/d);if(stt&&c.isConnected)stt.set('progress',p*1.08);if(p<1&&c.isConnected)requestAnimationFrame(step)};const t1=performance.now();requestAnimationFrame(step);
  run2=setTimeout(()=>{modal='pdf-done';state=state;render()},d+150)},1000*T)}
/* scrubbing & keys */
document.addEventListener('pointerdown',e=>{const sc=e.target.closest?.('#scrub');if(!sc||e.target.closest('.tick'))return;const mv=ev=>{const r=sc.getBoundingClientRect();setPos((ev.clientX-r.left)/r.width*(sel()?.sec||134))};mv(e);const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
document.addEventListener('keydown',e=>{
 if(e.target.id==='scrub'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){setPos(posSec+(e.key==='ArrowRight'?5:-5));e.preventDefault()}
 if(e.key==='Escape'&&(modal||menu)){close()}
 if(e.key==='Tab'&&modal){const list=$$('.sheet button,.sheet input,.sheet select,.sheet textarea').filter(x=>!x.disabled);const first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('sheet'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLowerCase();$$('.rw').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}if(e.target.id==='rename')sel().title=e.target.value});
document.fonts?.ready.then(()=>placeUl(false));
render();
</script></body></html>
