<!doctype html>
<meta charset="utf-8">
<title>Issue 24 bridge companion</title>
<button id="step">Send step</button>
<button id="drop">Disconnect</button>
<pre id="out">connecting...</pre>
<script>
const out = document.querySelector("#out");
const socket = new WebSocket("ws://127.0.0.1:8765");
socket.onopen = () => {
  out.textContent = "OPEN\n";
  socket.send(JSON.stringify({ v: 1, type: "hello", role: "companion" }));
};
socket.onmessage = (event) => {
  out.textContent += `${event.data}\n`;
};
socket.onerror = () => {
  out.textContent += "ERROR\n";
};
socket.onclose = () => {
  out.textContent += "CLOSED\n";
};
document.querySelector("#step").onclick = () => {
  socket.send(JSON.stringify({
    v: 1,
    type: "step",
    ts: Date.now(),
    label: "Browser step",
    cx: 0.5,
    cy: 0.5,
    redacted: false,
    screenshot: null,
  }));
};
document.querySelector("#drop").onclick = () => socket.close();
</script>
